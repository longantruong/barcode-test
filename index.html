<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Đọc barcode vé</title>

  <script src="https://unpkg.com/@zxing/browser@latest"></script>

  <style>
    :root {
      color: #172033;
      background: #f4f7fb;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 14px 12px;
      background:
        radial-gradient(circle at top left, #dceaff 0, transparent 32%),
        radial-gradient(circle at bottom right, #dff8ee 0, transparent 28%),
        #f4f7fb;
    }

    .scanner-card {
      width: min(100%, 390px);
      padding: 18px;
      text-align: center;
      background: rgba(255, 255, 255, 0.92);
      border: 1px solid rgba(255, 255, 255, 0.9);
      border-radius: 20px;
      box-shadow: 0 18px 50px rgba(31, 51, 89, 0.13);
    }

    .instruction {
      margin: 0 0 12px;
      color: #4e5d75;
      font-size: 14px;
      font-weight: 600;
    }

    .camera-frame {
      position: relative;
      overflow: hidden;
      width: min(100%, 270px);
      aspect-ratio: 8 / 3;
      margin: 0 auto;
      border: 1px solid #dde4f0;
      border-radius: 14px;
      background: #172033;
      box-shadow: 0 8px 20px rgba(23, 32, 51, 0.14);
    }

    video {
      width: 100%;
      height: 100%;
      display: block;
      object-fit: cover;
    }

    .scan-line {
      position: absolute;
      z-index: 1;
      top: 50%;
      left: 12%;
      width: 76%;
      height: 2px;
      border-radius: 99px;
      background: #6ef2b2;
      box-shadow: 0 0 12px #6ef2b2;
      animation: scan 2.4s ease-in-out infinite;
    }

    @keyframes scan {
      50% { transform: translateY(-55px); }
    }

    .status {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 8px;
      margin: 11px 0 8px;
      color: #68738a;
      font-size: 13px;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #2cc879;
      box-shadow: 0 0 0 4px #e0f8eb;
    }

    #result {
      min-height: 44px;
      display: grid;
      place-items: center;
      padding: 10px 12px;
      overflow-wrap: anywhere;
      color: #234991;
      font-size: 16px;
      font-weight: 700;
      letter-spacing: 0.01em;
      border: 1px dashed #c9d5e9;
      border-radius: 13px;
      background: #f7faff;
    }

    #resetButton {
      width: 100%;
      margin-top: 10px;
      padding: 10px 16px;
      color: #fff;
      font: inherit;
      font-weight: 700;
      cursor: pointer;
      border: 0;
      border-radius: 12px;
      background: #3568e8;
      box-shadow: 0 8px 16px rgba(53, 104, 232, 0.2);
      transition: transform 0.15s ease, background 0.15s ease;
    }

    #resetButton:hover:not(:disabled) {
      background: #2758d3;
      transform: translateY(-1px);
    }

    #resetButton:disabled {
      color: #8d9ab0;
      cursor: not-allowed;
      background: #e9eef6;
      box-shadow: none;
    }

    .number-pad {
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      gap: 7px;
      margin-top: 14px;
    }

    .number-button {
      min-height: 35px;
      padding: 0;
      color: #4a5871;
      font: inherit;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      border: 1px solid #dde4f0;
      border-radius: 9px;
      background: #fff;
      transition: background 0.15s ease, color 0.15s ease, transform 0.15s ease;
    }

    .number-button:hover,
    .number-button.active {
      color: #fff;
      border-color: #3568e8;
      background: #3568e8;
    }

    .number-button:active {
      transform: scale(0.95);
    }

    @media (max-width: 380px) {
      .scanner-card { padding: 15px; }
      .number-pad { gap: 5px; }
    }
  </style>
</head>

<body>

<main class="scanner-card">
  <p class="instruction">Hãy đưa mã barcode vào giữa khung hình</p>

  <div class="camera-frame">
    <video id="video" autoplay muted playsinline></video>
    <div class="scan-line" aria-hidden="true"></div>
  </div>

  <div class="status"><span class="status-dot"></span><span id="statusText">Đang mở camera...</span></div>
  <div id="result">Đang quét...</div>

  <button id="resetButton" type="button" disabled>Quét mã khác</button>

  <div class="number-pad" id="numberPad" aria-label="Chọn số"></div>
</main>

<script>

const video = document.getElementById("video");
const result = document.getElementById("result");
const resetButton = document.getElementById("resetButton");
const statusText = document.getElementById("statusText");
const numberPad = document.getElementById("numberPad");

let reader;
let isScanning = false;

for (let number = 1; number <= 30; number += 1) {
  const button = document.createElement("button");
  button.type = "button";
  button.className = `number-button${number === 1 ? " active" : ""}`;
  button.textContent = number;
  button.setAttribute("aria-label", `Số ${number}`);
  button.addEventListener("click", () => {
    document.querySelector(".number-button.active")?.classList.remove("active");
    button.classList.add("active");
  });
  numberPad.appendChild(button);
}

async function startScanner() {

  if (isScanning) return;

  isScanning = true;
  resetButton.disabled = true;
  result.textContent = "Đang quét...";
  statusText.textContent = "Đang quét barcode...";
  reader = new ZXingBrowser.BrowserMultiFormatReader();

  try {
    const devices =
      await ZXingBrowser.BrowserCodeReader.listVideoInputDevices();

    if (!devices.length) {
      result.textContent = "Không tìm thấy camera";
      statusText.textContent = "Camera chưa sẵn sàng";
      isScanning = false;
      return;
    }

    // Camera sau
    const deviceId = devices[devices.length - 1].deviceId;

    const activeReader = reader;

    activeReader.decodeFromVideoDevice(
      deviceId,
      video,
      (decoded, error) => {

        if (decoded && isScanning) {

          let code = decoded.getText();

          console.log("Barcode:", code);

          // Hiển thị barcode
          result.textContent = code;
          statusText.textContent = "Đã nhận diện thành công";

          // Cho phép quét mã mới trước khi dừng camera để nút không bị khóa
          isScanning = false;
          resetButton.disabled = false;

          // Dừng camera. Một vài trình duyệt có thể báo lỗi khi stream đã đóng.
          try {
            activeReader.reset();
          } catch (stopError) {
            console.warn("Không thể dừng camera:", stopError);
          }
        }

      }
    );
  } catch (error) {
    console.error(error);
    result.textContent = "Không thể mở camera";
    statusText.textContent = "Có lỗi khi truy cập camera";
    isScanning = false;
  }
}

resetButton.addEventListener("click", () => {
  if (reader) {
    try {
      reader.reset();
    } catch (stopError) {
      console.warn("Không thể dừng camera cũ:", stopError);
    }
  }

  startScanner();
});

startScanner();

</script>

</body>
</html>
